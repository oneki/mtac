<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in</title>
  <style nonce="{{nonce}}">
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f4f6; color: #111827; }
    main { max-width: 22rem; margin: 10vh auto; padding: 2rem; background: #fff; border-radius: .5rem; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
    h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
    p { margin: .5rem 0; color: #4b5563; font-size: .9rem; line-height: 1.4; }
    label { display: block; margin: 1rem 0 .25rem; font-size: .85rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: .6rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: .375rem; }
    button { width: 100%; margin-top: 1.5rem; padding: .7rem; font-size: 1rem; font-weight: 600; color: #fff; background: #1d4ed8; border: 0; border-radius: .375rem; cursor: pointer; }
    .error { margin-top: 1rem; padding: .6rem; color: #991b1b; background: #fee2e2; border-radius: .375rem; font-size: .9rem; }
    .qr { display: block; width: 12rem; height: 12rem; margin: 1rem auto; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    {{#clientName}}<p>to continue to {{clientName}}</p>{{/clientName}}
    {{#error}}<div class="error" role="alert">{{error}}</div>{{/error}}
    <form method="post" action="{{action}}">
      <input type="hidden" name="ctx" value="{{ctx}}">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <label for="username">Email</label>
      <input id="username" name="username" type="email" value="{{username}}" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
