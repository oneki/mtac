<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Forgot password</title>
  <style nonce="{{nonce}}">
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f4f6; color: #111827; }
    main { max-width: 22rem; margin: 10vh auto; padding: 2rem; background: #fff; border-radius: .5rem; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
    h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
    p { margin: .5rem 0; color: #4b5563; font-size: .9rem; line-height: 1.4; }
    label { display: block; margin: 1rem 0 .25rem; font-size: .85rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: .6rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: .375rem; }
    input[readonly] { color: #4b5563; background: #f3f4f6; }
    button, .button { display: block; box-sizing: border-box; width: 100%; margin-top: 1.5rem; padding: .7rem; font-size: 1rem; font-weight: 600; text-align: center; text-decoration: none; color: #fff; background: #1d4ed8; border: 0; border-radius: .375rem; cursor: pointer; }
    .error { margin-top: 1rem; padding: .6rem; color: #991b1b; background: #fee2e2; border-radius: .375rem; font-size: .9rem; }
    .hint { font-size: .8rem; }
    .links { margin: 1rem 0 0; text-align: center; font-size: .9rem; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Forgot password</h1>
    <p>Enter the email address of your account. We will send you a link to choose a new password.</p>
    {{#error}}<div class="error" role="alert">{{error}}</div>{{/error}}
    <form method="post" action="{{action}}">
      {{#ctx}}<input type="hidden" name="ctx" value="{{ctx}}">{{/ctx}}
      <input type="hidden" name="csrf" value="{{csrf}}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{email}}" autocomplete="username" maxlength="254" required autofocus>
      <button type="submit">Send the link</button>
    </form>
    {{#backUrl}}<p class="links"><a href="{{backUrl}}">Back to sign in</a></p>{{/backUrl}}
  </main>
</body>
</html>
